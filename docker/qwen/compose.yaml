# Optional Docker setup: Ollama + the Qwen consumer on a private network. From the repository root.
# Start Ollama:
#   docker compose -f docker/qwen/compose.yaml up -d ollama
# Pull the model once (about 3.3 GB):
#   docker compose -f docker/qwen/compose.yaml exec ollama ollama pull qwen3.5:4b-q4_K_M
# Offline tests:
#   docker compose -f docker/qwen/compose.yaml run --rm qwen
# Live smoke test (on Linux, add --user "$(id -u):$(id -g)" so outputs/ stays yours):
#   docker compose -f docker/qwen/compose.yaml run --rm qwen python scripts/qwen_smoke.py --live
# Live suite:
#   docker compose -f docker/qwen/compose.yaml run --rm -e NOVA_QWEN_LIVE=1 qwen python -m pytest -p no:cacheprovider -v tests/qwen_live
# Stop (keeps the model volume):
#   docker compose -f docker/qwen/compose.yaml down
# CPU-only. Give Docker at least 8 GB of memory (the model plus an 8K context uses about 5 GB).
name: nova-qwen
services:
  ollama:
    image: ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8  # 0.40.11
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"   # loopback only; never exposed to the network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
  qwen:
    build:
      context: ../..
      dockerfile: docker/qwen/Dockerfile
    image: nova-qwen:0.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      NOVA_OLLAMA_URL: http://ollama:11434
      NOVA_QWEN_ALLOW_REMOTE_OLLAMA: "1"   # 'ollama' is the private compose service, not a remote host
    volumes:
      - ../../outputs:/nova/outputs
volumes:
  ollama-models:
